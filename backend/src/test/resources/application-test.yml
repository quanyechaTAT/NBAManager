spring:
  datasource:
    url: jdbc:mysql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:3306}/nba_manager_test_${random.uuid}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&useUnicode=true
    username: ${TEST_DB_USERNAME:root}
    password: ${TEST_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    # 测试库为一次性空库，schema 全部由 create-drop 建立，保持与迁移解耦
    enabled: false
  data:
    redis:
      host: ${TEST_REDIS_HOST:localhost}
      port: ${TEST_REDIS_PORT:6379}

app:
  jwt:
    secret: test-secret-key-at-least-256-bits-long-for-hmac
    expiration-ms: 86400000
  chat:
    cleanup-enabled: true
    retention-days: 180
    cleanup-batch-size: 1000
    cleanup-cron: "0 0 3 * * ?"
    cleanup-max-batches: 500
