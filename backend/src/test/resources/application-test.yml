spring:
  datasource:
    url: jdbc:mysql://localhost:3306/nba_manager_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&useUnicode=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:[REMOVED_DB_PASSWORD]}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: test-secret-key-at-least-256-bits-long-for-hmac
    expiration-ms: 86400000
  chat:
    cleanup-enabled: true
    retention-days: 180
    cleanup-batch-size: 1000
    cleanup-cron: "0 0 3 * * ?"
    cleanup-max-batches: 500
