# Run with an absolute prefix pointing at this deploy directory; create logs/ first.
# Example: nginx -p /srv/NBAManager/deploy/ -c nginx.conf
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;
events { worker_connections 1024; }
http {
    client_body_temp_path logs/client_body_temp;
    proxy_temp_path logs/proxy_temp;
    fastcgi_temp_path logs/fastcgi_temp;
    uwsgi_temp_path logs/uwsgi_temp;
    scgi_temp_path logs/scgi_temp;
    types {
        text/html html; text/css css; application/javascript js mjs;
        application/json json; image/svg+xml svg; image/png png; image/jpeg jpg jpeg;
        image/webp webp; image/avif avif; image/gif gif; image/x-icon ico;
        font/woff woff; font/woff2 woff2; application/wasm wasm;
    }
    default_type application/octet-stream;
    access_log logs/access.log;
    sendfile on;
    etag on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 4;
    # SSE is excluded, and its location disables compression explicitly.
    gzip_types text/css application/javascript application/json image/svg+xml;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    upstream nba_backend { server 127.0.0.1:8080; keepalive 16; }
    server {
        # Local preview by default. Configure the production listen/TLS/domain before publishing.
        listen 127.0.0.1:18080;
        server_name localhost;
        root ../frontend/dist;
        index index.html;
        client_max_body_size 12m;

        location = /api/rag/stream {
            proxy_pass http://nba_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 600s;
            add_header X-Accel-Buffering no always;
            # Java retains its own no-cache,no-transform and authentication headers.
        }
        location /api/ {
            proxy_pass http://nba_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_cache off;
        }
        location = /api { proxy_pass http://nba_backend; proxy_cache off; }
        location = /assets { return 404; }
        location = /uploads { proxy_pass http://nba_backend; proxy_cache off; }
        location = /actuator { proxy_pass http://nba_backend; proxy_cache off; }
        location /uploads/ { proxy_pass http://nba_backend; proxy_cache off; }
        location /actuator/ { proxy_pass http://nba_backend; proxy_cache off; }
        location /ws {
            proxy_pass http://nba_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 90s;
            proxy_buffering off;
        }
        location ~ "^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?|png|jpe?g|svg|webp|ico|gif|avif)$" {
            try_files $uri @missing_asset;
            # Without "always", an asset 404 never gets the immutable header.
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location /assets/ {
            try_files $uri @missing_asset;
            add_header Cache-Control "no-cache" always;
        }
        location @missing_asset {
            add_header Cache-Control "no-store" always;
            return 404;
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }
    }
}
