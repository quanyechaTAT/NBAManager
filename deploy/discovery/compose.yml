name: nba-discovery

services:
  mysql:
    image: mysql:8.0.41
    command: [--server-id=184054, --log-bin=mysql-bin, --binlog-format=ROW, --binlog-row-image=FULL, --binlog-expire-logs-seconds=604800, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    environment:
      MYSQL_ROOT_PASSWORD: ${DISCOVERY_DB_PASSWORD:?Set DISCOVERY_DB_PASSWORD}
      MYSQL_DATABASE: ${DISCOVERY_DB_NAME:-nba_discovery_test}
    ports: ['127.0.0.1:${DISCOVERY_DB_PORT:-13306}:3306']
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost --silent']
      interval: 5s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.4.2-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 256mb, --maxmemory-policy, allkeys-lru]
    ports: ['127.0.0.1:16379:6379']
    volumes: [redis-data:/data]
    restart: unless-stopped
  opensearch:
    image: opensearchproject/opensearch:2.19.2
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      DISABLE_SECURITY_PLUGIN: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms1g -Xmx1g'
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    ports: ['127.0.0.1:19200:9200']
    volumes: [search-data:/usr/share/opensearch/data]
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:9200/_cluster/health >/dev/null']
      interval: 10s
      retries: 30
    restart: unless-stopped
  kafka:
    image: apache/kafka:3.9.1
    ports: ['127.0.0.1:19092:19092']
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null']
      interval: 10s
      retries: 30
    restart: unless-stopped
  connect:
    image: quay.io/debezium/connect:3.1.2.Final
    depends_on:
      kafka: {condition: service_healthy}
      mysql: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: nba-discovery-connect
      CONFIG_STORAGE_TOPIC: discovery_connect_configs
      OFFSET_STORAGE_TOPIC: discovery_connect_offsets
      STATUS_STORAGE_TOPIC: discovery_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
    ports: ['127.0.0.1:18083:8083']
    restart: unless-stopped
  api:
    profiles: [app]
    build: {context: ../.., dockerfile: deploy/discovery/Dockerfile}
    environment: &discovery-environment
      DISCOVERY_DB_HOST: mysql
      DISCOVERY_DB_PORT: 3306
      DISCOVERY_DB_NAME: ${DISCOVERY_DB_NAME:-nba_discovery_test}
      DISCOVERY_DB_USER: root
      DISCOVERY_DB_PASSWORD: ${DISCOVERY_DB_PASSWORD:?Set DISCOVERY_DB_PASSWORD}
      DISCOVERY_REDIS_URL: redis://redis:6379/2
      DISCOVERY_OPENSEARCH_URL: http://opensearch:9200
      DISCOVERY_KAFKA: kafka:9092
      DISCOVERY_INTERNAL_TOKEN: ${DISCOVERY_INTERNAL_TOKEN:?Set DISCOVERY_INTERNAL_TOKEN}
      DISCOVERY_RUNTIME: /runtime
      HF_HOME: /model-cache
      DISCOVERY_EMBEDDING_ENABLED: ${DISCOVERY_EMBEDDING_ENABLED:-true}
      DISCOVERY_EMBEDDING_MODEL: ${DISCOVERY_EMBEDDING_MODEL:-richinfoai/ritrieve_zh_v1}
      DISCOVERY_EMBEDDING_DIM: ${DISCOVERY_EMBEDDING_DIM:-1792}
    ports: ['127.0.0.1:19001:19001']
    volumes: [discovery-runtime:/runtime, model-cache:/model-cache]
    command: [uvicorn, discovery_app.api:app, --host, 0.0.0.0, --port, '19001']
    restart: unless-stopped
  cdc-worker:
    profiles: [app]
    build: {context: ../.., dockerfile: deploy/discovery/Dockerfile}
    environment: *discovery-environment
    volumes: [discovery-runtime:/runtime, model-cache:/model-cache]
    command: [python, -m, discovery_app.worker, cdc]
    restart: unless-stopped
  jobs-worker:
    profiles: [app]
    build: {context: ../.., dockerfile: deploy/discovery/Dockerfile}
    environment: *discovery-environment
    volumes: [discovery-runtime:/runtime, model-cache:/model-cache]
    command: [python, -m, discovery_app.worker, jobs]
    restart: unless-stopped
  embedding-worker:
    profiles: [app]
    build: {context: ../.., dockerfile: deploy/discovery/Dockerfile}
    environment: *discovery-environment
    volumes: [discovery-runtime:/runtime, model-cache:/model-cache]
    command: [python, -m, discovery_app.worker, embeddings]
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  search-data:
  kafka-data:
  discovery-runtime:
  model-cache:
